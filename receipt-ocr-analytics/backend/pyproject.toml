[project]
name = "receipt-ocr-analytics"
version = "1.0.0"
description = "Parse receipt images to structured data and analytics"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "SQLAlchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.3.0"
]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
