[project]
name = "receipt-ocr-analytics"
version = "1.0.0"
description = "Receipt image upload, Tesseract OCR, rule-based parsing and spend analytics (FastAPI + SQLAlchemy + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "SQLAlchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.1",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.10",
    "Pillow>=10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/migrations/*.py", "db/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic
